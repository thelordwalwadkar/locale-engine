# de-DE — German for Germany (FROZEN in Phase 1). Produced directly from the source, never converted from another German variant.
locale: de-DE
language: de
region: DE
display_name: German (Germany)
audience_label: German
description: >-
  Standard German for industrial and municipal buyers in Germany: formal Sie, current orthography with ß, factual and
  technically precise, with German number, currency and date conventions.
hreflang: de-DE

formatting:
  number: { decimal: ',', thousands: '.', accepted_thousands: ['.'], dash_decimal: keep, example: '1.234,56' }
  currency: { local_code: EUR, local_symbol: '€', position: after, space: nbsp, accept_alternate_position: false, example: "1.234,56 €" }
  date: { numeric: 'DD.MM.YYYY', zero_pad: true, textual_example: '30. September 2026' }
  quotes: { open: '„', close: '“', open_inner: '‚', close_inner: '‘' }

slug:
  transliterate: { ä: ae, ö: oe, ü: ue, ß: ss }
  strip_diacritics: true

seo:
  title_max: 60
  meta_description_max: 155

prompt_notes:
  - 'Address the reader formally (Sie / Ihr, capitalised). Never use du.'
  - 'Use ß according to current orthography (Größe, Straße, groß). Swiss "ss" spellings are wrong here.'
  - 'Quotation marks „…“. Numbers 1.234,56; currency "1.234,56 €" with a no-break space; dates 30.09.2026 or "30. September 2026" (period after the day).'
  - 'Vocabulary: Angebot (not Offerte), Werktage, innerhalb von (not innert), Januar (not Jänner).'

rules:
  - id: DEDE-SZ-01
    type: lexicon
    lexicon_ref: de_eszett
    severity: major
    autofix: true
    message: German spelling in Germany uses ß where current orthography requires it; "ss" spellings such as Grösse or gross are Swiss.
    fix: Replace the "ss" spelling with ß.
    tests:
      - { target: 'Die Grösse der Pumpe ist gross.', expect: fail, fixed: 'Die Größe der Pumpe ist groß.' }
      - { target: 'Die Größe der Pumpe ist groß.', expect: pass }
      - { target: 'Unsere Hauptstrasse führt zum Werk.', expect: fail, fixed: 'Unsere Hauptstraße führt zum Werk.' }

  - id: DEDE-QUOTE-01
    type: lexicon
    lexicon_ref: de_quotes
    severity: minor
    autofix: true
    message: 'German quotation marks are low-high: „…“.'
    fix: Replace the quotation marks with „…“.
    tests:
      - { target: 'Das Modell "Flygt" ist robust.', expect: fail, fixed: 'Das Modell „Flygt“ ist robust.' }
      - { target: 'Das Modell „Flygt“ ist robust.', expect: pass }

  - id: DEDE-MONTH-01
    type: lexicon
    terms:
      - { pattern: '\bJänner\b', prefer: Januar }
    severity: minor
    autofix: true
    message: 'Standard German in Germany writes "Januar"; "Jänner" is Austrian.'
    fix: Use "Januar".
    tests:
      - { target: 'Verfügbar ab Jänner 2027.', expect: fail, fixed: 'Verfügbar ab Januar 2027.' }
      - { target: 'Verfügbar ab Januar 2027.', expect: pass }

  - id: DEDE-LEX-OFFERTE
    type: lexicon
    terms:
      - { pattern: '\b(?:(?:ein\w*|die|der|den|dem|ihr\w*|unser\w*)\s+)?(?:\p{L}+\s+)?Offerten?\b', prefer: Angebot, note: match includes article and adjective so the repair can re-inflect }
    severity: major
    message: '"Offerte" is Swiss usage; in Germany a quotation is a "Angebot".'
    fix: 'Use "Angebot" and adjust article and adjective endings (eine Offerte → ein Angebot).'
    tests:
      - { target: 'Fordern Sie eine unverbindliche Offerte an.', expect: fail }
      - { target: 'Fordern Sie ein unverbindliches Angebot an.', expect: pass }

  - id: DEDE-LEX-INNERT
    type: lexicon
    terms:
      - { pattern: '\binnert\b', prefer: 'innerhalb von' }
    severity: minor
    autofix: true
    message: '"innert" is a Swiss preposition; in Germany use "innerhalb von" (time).'
    fix: Use "innerhalb von".
    tests:
      - { target: 'Lieferung innert 5 Werktagen.', expect: fail, fixed: 'Lieferung innerhalb von 5 Werktagen.' }
      - { target: 'Lieferung innerhalb von 5 Werktagen.', expect: pass }

  - id: DEDE-FORMAL-01
    type: lexicon
    lexicon_ref: de_informal_du
    severity: major
    message: B2B copy addresses the reader formally (Sie / Ihr); informal du-forms are not acceptable.
    fix: Rewrite the sentence with Sie / Ihr.
    tests:
      - { target: 'Hast du Fragen? Dann ruf uns an.', expect: fail }
      - { target: 'Haben Sie Fragen? Dann rufen Sie uns an.', expect: pass }

  - id: DEDE-NUM-01
    type: format
    aspect: number
    severity: major
    message: 'German numbers use a full stop for thousands and a comma for decimals: 1.234,56.'
    fix: Write numbers as 1.234,56.
    tests:
      - { target: 'Förderstrom bis 1.250,5 m³/h.', expect: pass }
      - { target: 'Förderstrom bis 1,250.5 m³/h.', expect: fail }

  - id: DEDE-CUR-01
    type: format
    aspect: currency
    severity: major
    message: 'German amounts put the symbol after the number with a no-break space: 1.234,56 €.'
    fix: Write 1.234,56 € (no-break space before the symbol).
    tests:
      - { target: 'Ab 1.250,00 € zzgl. MwSt.', expect: pass }
      - { target: "Ab 1.250,00 € zzgl. MwSt.", expect: pass }
      - { target: 'Ab € 1.250,00 zzgl. MwSt.', expect: fail }

  - id: DEDE-DATE-01
    type: format
    aspect: date
    severity: minor
    message: 'German numeric dates are DD.MM.YYYY.'
    fix: Write 30.09.2026.
    tests:
      - { target: 'Verfügbar ab 30.09.2026.', expect: pass }
      - { target: 'Verfügbar ab 30/09/2026.', expect: fail }

  - id: DEDE-DATE-02
    type: lexicon
    lexicon_ref: de_date_period
    severity: minor
    autofix: true
    message: 'Written German dates have a period after the day: 30. September 2026.'
    fix: Insert the period after the day number.
    tests:
      - { target: 'Verfügbar ab 30 September 2026.', expect: fail, fixed: 'Verfügbar ab 30. September 2026.' }
      - { target: 'Verfügbar ab 30. September 2026.', expect: pass }

market_checks:
  - id: DEDE-MARKET-IMPRESSUM
    text: Commercial websites in Germany need a complete Impressum (provider identification under the Digitale-Dienste-Gesetz); check that the German pages link to one.
    verify_with_counsel: true
  - id: DEDE-MARKET-TRUST
    text: Reference TÜV, DIN or VDMA standards and memberships only where they genuinely apply to the products or the company.
  - id: DEDE-MARKET-LEGAL
    text: German legal pages (Impressum, Datenschutzerklärung, AGB) must be reviewed by counsel; translation alone does not make them compliant.
    applies: legal_page
    verify_with_counsel: true

edge_exemplars: [edge_de_at_month, edge_mixed_language, edge_legal_page]
