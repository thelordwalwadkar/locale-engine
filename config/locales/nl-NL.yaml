# nl-NL — Dutch for the Netherlands (FROZEN in Phase 1). The default SOURCE locale; also a target for en-* sources when enabled.
locale: nl-NL
language: nl
region: NL
display_name: Dutch (Netherlands)
audience_label: Dutch
description: >-
  Dutch for Dutch industrial, municipal and institutional buyers: formal "u", direct and factual, with Dutch number,
  currency and date conventions.
hreflang: nl-NL

formatting:
  number: { decimal: ',', thousands: '.', accepted_thousands: ['.'], dash_decimal: keep, example: '1.234,56' }
  currency: { local_code: EUR, local_symbol: '€', position: before, space: space, accept_alternate_position: false, example: '€ 1.234,56' }
  date: { numeric: 'DD-MM-YYYY', zero_pad: true, textual_example: '30 september 2026' }
  quotes: { open: '“', close: '”', open_inner: '‘', close_inner: '’' }

slug:
  transliterate: {}
  strip_diacritics: true

seo:
  title_max: 60
  meta_description_max: 155

prompt_notes:
  - 'Address the reader formally with "u" / "uw". Avoid je / jij / jouw in B2B copy.'
  - 'Numbers 1.234,56; currency "€ 1.234,56"; dates 30-09-2026 or "30 september 2026" (month in lower case).'
  - 'Keep Dutch business terms: BTW, KvK, offerte, werkdagen.'

rules:
  - id: NLNL-FORMAL-01
    type: lexicon
    terms:
      - { pattern: '\b(?:je|jij|jou|jouw)\b', note: informal address }
    severity: minor
    message: 'B2B Dutch addresses the reader as "u" / "uw".'
    fix: Use u / uw.
    tests:
      - { target: 'Neem contact met ons op als je vragen hebt.', expect: fail }
      - { target: 'Neem contact met ons op als u vragen hebt.', expect: pass }

  - id: NLNL-NUM-01
    type: format
    aspect: number
    severity: major
    message: 'Dutch numbers use a full stop for thousands and a comma for decimals: 1.234,56.'
    fix: Write numbers as 1.234,56.
    tests:
      - { target: 'Debiet tot 1.250,5 m³/h.', expect: pass }
      - { target: 'Debiet tot 1,250.5 m³/h.', expect: fail }

  - id: NLNL-CUR-01
    type: format
    aspect: currency
    severity: major
    message: 'Dutch amounts put the symbol before the number with a space: € 1.234,56.'
    fix: Write € 1.234,56.
    tests:
      - { target: 'Vanaf € 1.250,00 excl. BTW.', expect: pass }
      - { target: 'Vanaf 1.250,00 € excl. BTW.', expect: fail }

  - id: NLNL-DATE-01
    type: format
    aspect: date
    severity: minor
    message: 'Dutch numeric dates are DD-MM-YYYY.'
    fix: Write 30-09-2026.
    tests:
      - { target: 'Beschikbaar vanaf 30-09-2026.', expect: pass }
      - { target: 'Beschikbaar vanaf 30/09/2026.', expect: fail }

market_checks:
  - id: NLNL-MARKET-REG
    text: Dutch companies normally show their KvK number, BTW-identificatienummer and registered address in the footer of commercial pages.
    verify_with_counsel: true
  - id: NLNL-MARKET-LEGAL
    text: Dutch legal pages (privacyverklaring under the AVG, algemene voorwaarden, cookiebeleid) must be reviewed by counsel; translation alone does not make them compliant.
    applies: legal_page
    verify_with_counsel: true

edge_exemplars: [edge_mixed_language, edge_legal_page]
